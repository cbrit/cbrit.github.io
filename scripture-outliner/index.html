<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d4a3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Hand-outline scripture passages with word-level selection." />
    <title>Scripture Outliner</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233d4a3a'/%3E%3Crect x='14' y='14' width='36' height='36' rx='4' fill='%23fcf8f0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/scripture-outliner/assets/index-CcGgrwDF.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const parts = await Promise.all(
        [1, 2, 3, 4].map((n) =>
          fetch(`/scripture-outliner/assets/app.p${n}.b64.txt`).then((r) => {
            if (!r.ok) throw new Error(`chunk ${n} ${r.status}`);
            return r.text();
          })
        )
      );
      const binary = atob(parts.join("").replace(/\s/g, ""));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const code = new TextDecoder("utf-8").decode(bytes);
      const blob = new Blob([code], { type: "text/javascript" });
      await import(URL.createObjectURL(blob));
    </script>
  </body>
</html>
