<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d4a3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Hand-outline scripture passages with word-level selection." />
    <title>Scripture Outliner</title>
    <link rel="stylesheet" href="/assets/index-CcGgrwDF.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const parts = await Promise.all(
        [1, 2, 3, 4].map((i) =>
          fetch(`/assets/app.p${i}.b64.txt`).then((r) => {
            if (!r.ok) throw new Error(`Failed to load chunk ${i}`);
            return r.text();
          }),
        ),
      );
      const js = atob(parts.join("").replace(/\s+/g, ""));
      const script = document.createElement("script");
      script.type = "module";
      script.textContent = js;
      document.body.appendChild(script);
    </script>
  </body>
</html>
